name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # TensorFlow / basic-pitch require 3.10.x.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        # The slow marker covers the end-to-end Basic Pitch regressions, which
        # need the audio fixtures and several minutes of inference each.
        # Coverage settings (source, branch mode, fail_under) live in .coveragerc.
        run: pytest -m "not slow" -q --cov --cov-report=term-missing
